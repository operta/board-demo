<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reservierungs-Board Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#eef0f3;font-family:'Poppins',Arial,sans-serif;color:#1a2130}
  .card{background:#fff;border:1px solid #e5e3dd;border-radius:16px;padding:34px 30px;box-shadow:0 8px 26px rgba(20,30,60,.10);width:320px;text-align:center}
  .mk{width:44px;height:44px;border-radius:12px;background:#0f1b33;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:20px}
  h1{font-size:16px;margin:0 0 4px}
  p{font-size:12px;color:#8a90a0;margin:0 0 18px}
  input{width:100%;box-sizing:border-box;border:1.5px solid #dfe3ea;border-radius:10px;padding:11px 12px;font-family:inherit;font-size:14px;text-align:center}
  input.err{border-color:#d9534f;animation:sh .3s}
  @keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  button{width:100%;margin-top:10px;background:#0f1b33;color:#fff;border:none;border-radius:10px;padding:12px 0;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer}
  .e{color:#d9534f;font-size:11px;height:14px;margin-top:8px}
</style></head><body>
<form class="card" id="f">
  <div class="mk">M</div>
  <h1>Reservierungs-Board</h1>
  <p>Demo — bitte Passwort eingeben.</p>
  <input type="password" id="pw" autofocus autocomplete="current-password" placeholder="Passwort">
  <button type="submit">Ansehen</button>
  <div class="e" id="err"></div>
</form>

async function unlock(pw){
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:SALT, iterations:250000, hash:"SHA-256"}, km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:NONCE}, key, CT);
  return new TextDecoder().decode(pt);
}
async function go(pw){
  try{
    const html = await unlock(pw);
    try{ sessionStorage.setItem("mvdemo", pw); }catch(e){}
    document.open(); document.write(html); document.close();
  }catch(e){
    const i = document.getElementById("pw");
    i.classList.remove("err"); void i.offsetWidth; i.classList.add("err");
    document.getElementById("err").textContent = "Falsches Passwort.";
    return false;
  }
}
document.getElementById("f").addEventListener("submit", e => { e.preventDefault(); go(document.getElementById("pw").value); });
try{ const s = sessionStorage.getItem("mvdemo"); if (s) go(s); }catch(e){}
